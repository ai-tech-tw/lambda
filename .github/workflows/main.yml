name: Main workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & compile check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen

      - name: Verify compilation
        run: uv run python -m py_compile app.py config.py prompts.py clients/line.py clients/openai.py tools/*.py utils/*.py

  build-and-push-image:
    name: Build and publish a Docker image
    needs: check
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU and Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-service:
    name: Deploy application as service
    needs: build-and-push-image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_name == 'main'

    steps:
      - name: Deploy via Webhook
        env:
          WEBHOOK_URL: ${{ vars._WEBHOOK_URL_PART_UP }}
          WEBHOOK_SECRET: ${{ secrets._WEBHOOK_SECRET_PART_UP }}
          WEBHOOK_DEPLOY_PATH: ${{ vars._WEBHOOK_DEPLOY_PATH }}
        if: ${{ env.WEBHOOK_URL != '' }}
        run: |
          curl --silent --show-error --fail -X POST \
            -H "X-Nymph-Stack-Secret: $WEBHOOK_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"path\": \"$WEBHOOK_DEPLOY_PATH\"}" \
            "$WEBHOOK_URL"
